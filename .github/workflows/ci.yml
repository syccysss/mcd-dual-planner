name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 单元测试（Node ${{ matrix.node }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 项目零第三方依赖，无需 npm install
      - name: 运行测试
        run: node --test

      - name: 检查文档相对链接
        run: node tools/check-links.mjs

      - name: 离线端到端冒烟
        run: node bin/mcd-dual.mjs plan --demo --budget 30 --out reports/report.svg

      - name: 校验 SVG 战报几何
        run: |
          python3 -m pip install --quiet lxml
          python3 tools/validate-svg.py reports/report.svg

      - name: 确认官方参赛声明未被改动
        run: |
          actual=$(sha256sum CONTEST_DECLARATION.md | cut -d' ' -f1)
          expected="cd28101bcb29cc8fb24b372fe91ce6b42c4a1487a54e01f7ade0c8c6a84241b7"
          if [ "$actual" != "$expected" ]; then
            echo "::error::CONTEST_DECLARATION.md 已被修改，官方要求文件名与内容均不可改动"
            exit 1
          fi
          echo "参赛声明校验通过：$actual"
